# Neuraxis development pilot: executable settings of docs/PILOT_PROTOCOL_V1.md (campaign `pilot-v2`).
# STATUS: fixed for PILOT_PROTOCOL_V1. Must agree with the protocol (tests/unit/test_pilot_protocol_v1.py).
# Exploratory/developmental data (D-026): a second development iteration informed by Pilot 1, not
# independent confirmation, and never used for the confirmatory estimate.
# features.yaml, tolerances.yaml and agent_policy.yaml in this directory are unchanged copies of configs/.
# Differences from configs/study.yaml are marked "# v2".
#   NEUROSEM_CONFIG_DIR=configs/pilot_protocol_v1 neurosem pilot --campaign pilot-v2

study_id: neurosem
status: fixed_pilot_protocol_v1        # v2

study_metadata:                        # v2: stamped on every run record, table, report and figure
  project_name: Neuraxis
  study_phase: development_pilot
  protocol_version: PILOT_PROTOCOL_V1
  designation: "Development study informed by Pilot 1; exploratory; not independent confirmation; never pooled with the confirmatory held-out estimate"

simulator: jneuroml

numerics:
  dt_nominal_ms: 0.005
  refinement_factors: [1, 2, 4]
  admissibility_factor: 2
  settle_ms: 300
  timeout_s: 7200
  java_max_memory: 2G

# Calibration procedure (not a detection protocol): the reference model's rheobase search sets
# every protocol amplitude. The same search on a variant is the "rheobase" detection measurement (P03).
rheobase:
  step_duration_ms: 500
  initial_hi_nA: 0.5
  grid: 12
  rounds: 4
  expand: 4.0
  max_hi_nA: 32.0
  spike_threshold_mV: -20.0
  fallback_rheobase_nA: 0.1

# Comparator (not one of P03-P09): the simulation shipped with each model.
canonical:
  protocol_id: P00_canonical
  source: shipped_harness
  # v2: primary panel = battery primary features that apply to a suprathreshold step (like-for-like, N-06)
  features: [spike_count, first_spike_latency, last_isi, adaptation_index, ap_amplitude, ahp_depth]
  # v2: remaining Pilot 1 canonical features, extracted as secondary exploratory outputs (D-029)
  secondary_features: [baseline_voltage, mean_frequency, ap_half_width, first_isi, firing_regime]

# v2: detection protocols. `features` = PRIMARY prespecified panel (decides every result);
# `secondary_features` = the rest of each protocol's Pilot 1 feature list, exploratory only (D-029).
# Primary panel across protocols: 8 features. Primary + secondary: the 18 Pilot 1 features.
protocols:
  - protocol_id: P03_rheobase         # variant rheobase measurement
  - protocol_id: P04_step_2x
    features: [spike_count, first_spike_latency, last_isi, adaptation_index, ap_amplitude, ahp_depth]
    secondary_features: [mean_frequency, ap_half_width, first_isi, burst_count, firing_regime]
  - protocol_id: P05_long_step
    features: [spike_count, first_spike_latency, last_isi, adaptation_index, ap_amplitude, ahp_depth]
    secondary_features: [mean_frequency, ap_half_width, first_isi, burst_count, firing_regime]
  - protocol_id: P06_ramp
    features: [spike_count, first_spike_latency]
    secondary_features: [mean_frequency, firing_regime]
  - protocol_id: P07_hyperpolarizing_step
    features: [steady_state_voltage, spike_count]
    secondary_features: [baseline_voltage, voltage_deflection, sag_ratio, minimum_voltage]
  - protocol_id: P08_rebound
    features: [spike_count, first_spike_latency]
    secondary_features: [maximum_voltage, firing_regime]
  - protocol_id: P09_short_pulse
    features: [spike_count, first_spike_latency, ap_amplitude, ahp_depth]
    secondary_features: [ap_half_width]

execution:
  workers: 12

paths:
  work: work
  results: results

pilot:
  models: [pospischil2008_rs, pospischil2008_lts, wangbuzsaki1996_wb, nml2_hh_example]   # v2
  repeated_models: [pospischil2008_rs, pospischil2008_lts]    # v2: used in Pilot 1 (reported separately)
  new_models: [wangbuzsaki1996_wb, nml2_hh_example]           # v2: independent sources new to Pilot 2
  # biophysical + reference = primary semantic stratum; numerical = separate robustness stress tests (N-15, D-030)
  mutation_families: [biophysical, reference, numerical]
  exclude_operators: [wrong_segment_group]   # v2: inert on single-compartment cells (Pilot 1: 4 of 4 equivalent)
  mutants_per_operator: 1            # v2: dry run gives 32 semantic + 12 numerical = 44 mutants
  transforms_per_operator: 1         # v2: 8 per model = 32 controls

analysis:
  n_boot: 10000
  n_perm: 10000
  seed: 20260913

selection:
  budget_k: 4
  random_draws: 10000
  seed: 20260913
  tie_break: [cost, protocol_id]
