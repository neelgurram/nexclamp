# NeuroSem continuous integration.
#
# STATUS (2026-09-13): this workflow has NEVER RUN. The repository has no GitHub remote yet, so
# nothing here has executed on GitHub-hosted runners; treat the first run as the verification.
# Action major versions were checked on 2026-09-13 with `git ls-remote --tags`
# (actions/checkout v7, actions/setup-python v7, actions/setup-java v6), and the inputs used
# below were read from each action's action.yml at that tag.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: pytest (ubuntu-latest, Python 3.12, Temurin 21)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      # Newest Temurin 21 at run time; sets JAVA_HOME, which neurosem's find_java() uses.
      # The exact pinned JRE (jdk-21.0.12.1+1, SHA-256 checked) is exercised by the docker job.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # requirements.lock was frozen on Windows. Every pin has a manylinux x86_64 wheel and no
      # Linux-only dependency is missing, so no Linux adjustment is currently applied; the next
      # step fails loudly if the Linux install diverges from the lock.
      - name: Install pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check

      - name: Check every lock pin is installed
        run: |
          python - <<'EOF'
          import subprocess, sys
          lock = {l.strip() for l in open("requirements.lock") if l.strip() and not l.startswith("#")}
          out = subprocess.run([sys.executable, "-m", "pip", "freeze", "--exclude-editable"],
                               capture_output=True, text=True, check=True).stdout
          frozen = set(out.split())
          print("installed but not in lock:", sorted(frozen - lock))
          missing = sorted(lock - frozen)
          sys.exit(f"lock pins not installed: {missing}" if missing else 0)
          EOF

      - name: Record environment
        run: |
          python -VV
          java -version
          python -c "from neurosem.simulators.jneuroml import JNeuroML; s = JNeuroML(); print(s.java, s.jar); print(s.version_string())"

      - name: Makefile dry run
        run: make -n setup java test test-fast validate-models pilot reproduce-paper docker-build docker-test lint

      - name: Bootstrap script against the live Adoptium API (dry run, no download)
        run: python scripts/bootstrap_java.py --dry-run --dest "$RUNNER_TEMP/java" --release jdk-21.0.12.1+1

      - name: Tests
        run: python -m pytest -q

  docker:
    name: docker build + test suite inside the image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg GIT_COMMIT=${{ github.sha }} --tag neurosem:ci .

      - name: Record image id
        run: docker image inspect --format '{{.Id}}' neurosem:ci

      - name: Run test suite inside the image
        run: docker run --rm neurosem:ci
