# NeuroSem exact dependency pins (the frozen study environment uses this file).
#
# Generated 2026-09-13 from the working development venv with
#   .venv/Scripts/python -m pip freeze --exclude-editable
# Platform: Windows 11 Home 10.0.22631, x86_64 (AMD64), CPython 3.12.10, pip 26.2.1.
# The editable neurosem line is excluded; install the package itself with
#   pip install --no-deps -e .
# after installing this file (see docs/REPRODUCING.md).
#
# Linux status: NOT yet verified by a real Linux install. Checked on 2026-09-13 only by
# (a) PyPI metadata: every pin has a manylinux x86_64 cp312/abi3 wheel or a pure-Python
#     wheel, so no source builds are expected on linux/amd64;
# (b) `pip install --dry-run --only-binary=:all: --platform manylinux_2_28_x86_64 ...`
#     resolving to exactly these 75 pins; and
# (c) evaluating every requirement marker for sys_platform=linux: no Linux-only
#     dependency is missing. colorama (via pytest) and tzdata (via pandas) are
#     Windows-conditional upstream but pure Python, so installing them on Linux is harmless.
# Packages with platform-specific wheels (numpy, scipy, pandas, lxml, efel, h5py, tables,
# blosc2, numexpr, matplotlib, pillow, ...) may still behave differently across platforms
# and must be re-verified in Docker / CI (.github/workflows/ci.yml) before a frozen run.
# Development tools (pytest, pytest-cov, coverage, ruff) are pinned here as well.
